<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Добавить объявление - Auto Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-car-front"></i> Auto Market
        </a>
        <a class="btn btn-outline-primary" href="/">
            <i class="bi bi-arrow-left"></i> Назад
        </a>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Добавить новое объявление</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/posts/create}"
                          method="post"
                          enctype="multipart/form-data"
                          th:object="${postDto}">

                        <div class="mb-3">
                            <label class="form-label">Описание *</label>
                            <textarea class="form-control"
                                      th:field="*{description}"
                                      rows="4"
                                      placeholder="Опишите автомобиль: состояние, особенности, преимущества..."
                                      required></textarea>
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('description')}"
                                 th:errors="*{description}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Цена (руб.) *</label>
                                <input type="number"
                                       class="form-control"
                                       th:field="*{price}"
                                       min="1"
                                       placeholder="1000000"
                                       required>
                                <div class="text-danger"
                                     th:if="${#fields.hasErrors('price')}"
                                     th:errors="*{price}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Пробег (км) *</label>
                                <input type="number"
                                       class="form-control"
                                       th:field="*{mileage}"
                                       min="0"
                                       placeholder="50000"
                                       required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Марка *</label>
                                <select class="form-select"
                                        th:field="*{brand}"
                                        required>
                                    <option value="">Выберите марку</option>
                                    <option th:each="brand : ${brands}"
                                            th:value="${brand}"
                                            th:text="${brand}"></option>
                                    <option value="Другая">Другая (указать в описании)</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Модель *</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{model}"
                                       placeholder="Camry, Civic и т.д."
                                       required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Год выпуска *</label>
                                <input type="number"
                                       class="form-control"
                                       th:field="*{manufactureYear}"
                                       min="1900"
                                       max="2024"
                                       placeholder="2020"
                                       required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Тип кузова *</label>
                                <select class="form-select"
                                        th:field="*{bodyType}"
                                        required>
                                    <option value="">Выберите тип</option>
                                    <option th:each="type : ${bodyTypes}"
                                            th:value="${type}"
                                            th:text="${type}"></option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Категория</label>
                                <select class="form-select"
                                        th:field="*{category}">
                                    <option value="">Выберите категорию</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat}"
                                            th:text="${cat}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Тип двигателя *</label>
                                <select class="form-select"
                                        th:field="*{engineType}"
                                        required>
                                    <option value="">Выберите тип</option>
                                    <option th:each="type : ${engineTypes}"
                                            th:value="${type}"
                                            th:text="${type}"></option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Коробка передач *</label>
                                <select class="form-select"
                                        th:field="*{transmission}"
                                        required>
                                    <option value="">Выберите коробку</option>
                                    <option th:each="trans : ${transmissions}"
                                            th:value="${trans}"
                                            th:text="${trans}"></option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Цвет</label>
                                <select class="form-select"
                                        th:field="*{color}">
                                    <option value="">Выберите цвет</option>
                                    <option th:each="color : ${colors}"
                                            th:value="${color}"
                                            th:text="${color}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Двигатель *</label>
                            <select class="form-select"
                                    th:field="*{engineId}"
                                    required>
                                <option value="">Выберите двигатель</option>
                                <option th:each="engine : ${engines}"
                                        th:value="${engine.id}"
                                        th:text="${engine.name + ' (' + engine.volume + ' л, ' + engine.power + ' л.с.)'}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Фотографии (максимум 5)</label>
                            <input type="file"
                                   class="form-control"
                                   name="photos"
                                   multiple
                                   accept="image/*">
                            <small class="form-text text-muted">
                                Можно загрузить несколько фотографий. Максимальный размер файла: 5MB
                            </small>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Опубликовать
                            </button>
                            <a href="/" class="btn btn-outline-secondary">
                                Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
