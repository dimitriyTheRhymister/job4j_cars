# =======================
# DATABASE CONFIGURATION
# =======================

# H2 File-based DB (for development)
spring.datasource.url=jdbc:h2:file:./db/cars_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate dialect (default: H2)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# DDL mode: 'validate' when using Liquibase (do NOT use 'update'!)
spring.jpa.hibernate.ddl-auto=validate

# =======================
# H2 CONSOLE (for debugging)
# =======================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =======================
# THYMELEAF
# =======================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =======================
# FILE UPLOAD
# =======================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads/

# =======================
# SPRING & HIBERNATE INTEGRATION
# =======================
# Disable Spring Boot auto-config for JPA since we use pure Hibernate
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# =======================
# LIQUIBASE
# =======================
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
# Optional: if you want Liquibase to manage the DB schema exclusively
# spring.liquibase.enabled=true

# =======================
# LOGGING
# =======================
logging.level.org.springframework=INFO
logging.level.ru.job4j.cars=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =======================
# SERVER
# =======================
server.port=8080
server.servlet.context-path=/